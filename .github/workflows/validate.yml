name: Swift package validation

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.os }} · Swift ${{ matrix.swift }} · ${{ matrix.codec }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
        swift: ['6.2.0', '6.4.3']
        codec: [default, FoundationJSON]
    env:
      LIMB_CI_CODEC: ${{ matrix.codec }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3
        with:
          swift-version: ${{ matrix.swift }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Build and test package
        run: |
          if [[ "$LIMB_CI_CODEC" == FoundationJSON ]]; then
            swift build --traits FoundationJSON
            ./scripts/ci.sh pr-foundation
          else
            swift build
            ./scripts/ci.sh pr
          fi
      - name: Run README example over stdio
        run: node Tests/Inspector/readme-smoke.mjs "$LIMB_CI_CODEC"
