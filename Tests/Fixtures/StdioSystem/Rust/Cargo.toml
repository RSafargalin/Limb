[package]
name = "stdio-system-peer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rmcp = { version = "=3.11.0", default-features = false, features = ["client", "server", "transport-child-process", "transport-io"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
